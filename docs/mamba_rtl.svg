<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="946" viewBox="0 0 1320 946" role="img" aria-label="Block schematic of the state-space source: the layered machine, the memories, and one step drawn as the program the counter runs">
  <style>
    /* One palette, and it is the light one; see docs/board_rtl.svg for the reason. */
    :root {
      --bg: #ffffff; --fg: #1b1f24; --muted: #5c6570; --line: #3d454f;
      --box: #f2f4f7; --accent: #b45309; --accent-fill: #fdf3e3;
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--fg); }
    .b  { font-size: 12.5px; font-weight: 600; }
    .t  { font-size: 12px; }
    .s  { font-size: 10.5px; fill: var(--muted); }
    .blk     { fill: var(--box); stroke: var(--line); stroke-width: 1.4; }
    .outacc  { fill: none; stroke: var(--accent); stroke-width: 1.5; stroke-dasharray: 7 5; }
    .outline { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .wire    { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .thin    { stroke-width: 1; opacity: .8; }
    .brace   { fill: none; stroke: var(--accent); stroke-width: 1.4; }
    .ghost   { fill: none; stroke: var(--muted); stroke-width: 1.1; stroke-dasharray: 5 4; }
    .gwire   { stroke: var(--muted); stroke-width: 1.1; fill: none; }
    .elab    { stroke: var(--accent); stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
    .state   { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--muted)"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1320" height="946" fill="var(--bg)"/>

  <!-- the block -->
  <rect class="outacc" x="150" y="55" width="1020" height="430" rx="8"/>
  <text class="b" x="164" y="77" style="fill:var(--accent)">Mamba.Source<tspan class="s"> — a source on Source_intf, unchanged. One step is one step of the recurrence and four draws.</tspan></text>

  <!-- the ports -->
  <text class="t" x="144" y="122" text-anchor="end">rewind</text>
  <text class="s" x="144" y="138" text-anchor="end">loads SEED</text>
  <line class="wire" x1="150" y1="117" x2="180" y2="117" marker-end="url(#a)"/>
  <text class="t" x="144" y="182" text-anchor="end">step</text>
  <line class="wire" x1="150" y1="177" x2="180" y2="177" marker-end="url(#a)"/>
  <text class="t" x="144" y="232" text-anchor="end">idle</text>
  <text class="s" x="144" y="248" text-anchor="end">at rest</text>
  <polyline class="wire" points="200,195 200,227 150,227" marker-end="url(#a)"/>
  <text class="t" x="1174" y="155">frame[31:0] · valid</text>
  <text class="s" x="1174" y="171">four codes, seat 0 low</text>
  <polyline class="wire" points="390,120 404,120 404,86 1145,86 1145,150 1170,150" marker-end="url(#a)"/>

  <!-- the control -->
  <rect class="blk" x="180" y="95" width="210" height="100" rx="5"/>
  <text class="b" x="194" y="117">L4 · the outer machine</text>
  <text class="s" x="194" y="136">take rewind, run the lead-in,</text>
  <text class="s" x="194" y="152">hold the drawn frame, and</text>
  <text class="s" x="194" y="168">answer step</text>
  <text class="s" x="194" y="186">no slot count: nothing ages</text>

  <rect class="blk" x="180" y="225" width="210" height="215" rx="5"/>
  <text class="b" x="194" y="247">L3 · the counter</text>
  <text class="s" x="194" y="266">the schedule of L2, folded</text>
  <text class="s" x="194" y="282">into the cases of a counter</text>
  <text class="s" x="194" y="304">the cases are the decode of</text>
  <text class="s" x="194" y="320">this counter and the parallel</text>
  <text class="s" x="194" y="336">case on every register they</text>
  <text class="s" x="194" y="352">write: L2 has no block, and</text>
  <text class="s" x="194" y="368">that is where it lives</text>
  <text class="s" x="194" y="396">seat: 2 bits · tick: 4, for the</text>
  <text class="s" x="194" y="412">decay's two table reads</text>
  <text class="s" x="194" y="430">no hold: no walk ever stalls</text>

  <polyline class="wire thin" points="285,225 285,195" marker-end="url(#a)"/>
  <line class="wire thin" x1="390" y1="245" x2="430" y2="245" marker-end="url(#a)"/>
  <line class="wire thin" x1="390" y1="395" x2="430" y2="395" marker-end="url(#a)"/>
  <text class="s" x="420" y="472">the decode, and the muxes it widens: it reaches every register that a case writes</text>

  <!-- L1: the datapath, and the memories are part of it -->
  <rect class="outline" x="430" y="95" width="690" height="250" rx="6"/>
  <text class="b" x="444" y="117">L1 · the datapath<tspan class="s"> — Mac behind the one multiplier, and the memories: about 55 tiles of 135</tspan></text>

  <rect class="blk" x="445" y="128" width="215" height="190" rx="5"/>
  <text class="b" x="457" y="150">Mac</text>
  <text class="s" x="457" y="169">one DSP48, 25 by 18,</text>
  <text class="s" x="457" y="185">signed</text>
  <text class="s" x="457" y="207">one term a cycle, and a</text>
  <text class="s" x="457" y="223">tag travels beside it</text>
  <text class="s" x="457" y="239">from the address to the</text>
  <text class="s" x="457" y="255">retirement</text>
  <text class="s" x="457" y="281">era four's unit at 14-bit</text>
  <text class="s" x="457" y="297">counters: the state walks</text>
  <text class="s" x="457" y="313">2 048 rows, not 256</text>
  <line class="wire thin" x1="660" y1="180" x2="680" y2="180" marker-end="url(#a)"/>
  <line class="wire thin" x1="680" y1="205" x2="660" y2="205" marker-end="url(#a)"/>

  <rect class="blk" x="680" y="128" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="146">weight ROM</text>
  <text class="s" x="800" y="146">178 432 x 8, in banks of 2^15 rows at most</text>
  <rect class="state" x="680" y="154" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="172">state RAM</text>
  <text class="s" x="800" y="172">6 x 128 x 16 x 16 · read and written IN PLACE</text>
  <rect class="state" x="680" y="180" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="198">tap rings</text>
  <text class="s" x="800" y="198">6 x 160 x 4 x 16 · the conv inputs, a ring of 4</text>
  <rect class="blk" x="680" y="206" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="224">h</text>
  <text class="s" x="800" y="224">64 x 32 · the residual stream, and the chain</text>
  <rect class="blk" x="680" y="232" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="250">y</text>
  <text class="s" x="800" y="250">128 x 16 · both norms: the stream and the gate</text>
  <rect class="blk" x="680" y="258" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="276">shared</text>
  <text class="s" x="800" y="276">292 x 32 · zxbcdt, the gate, logits, weights</text>
  <rect class="blk" x="680" y="284" width="425" height="26" rx="4"/>
  <text class="t" x="690" y="302">readout · inject</text>
  <text class="s" x="800" y="302">128 x 16 and 64 x 16 · y_out, and dt times B</text>

  <text class="s" x="444" y="336">every read is two cycles from the address to the data, and the ROM spends them on one address register</text>

  <!-- L0 -->
  <rect class="blk" x="430" y="368" width="690" height="82" rx="5"/>
  <text class="b" x="444" y="390">L0 · the primitives</text>
  <text class="s" x="600" y="390">Divider · Isqrt · Exp2 · Prng.Rtl · Sigmoid · Softplus</text>
  <text class="s" x="444" y="414">every product fits one DSP48, and the timing of the machine rests on that rule:</text>
  <text class="s" x="444" y="430">the DSP stays a two-register multiply with a fabric adder behind it</text>
  <polyline class="wire thin" points="700,368 700,345" marker-end="url(#a)"/>

  <!-- the program -->
  <rect class="outline" x="150" y="515" width="1020" height="415" rx="8"/>
  <polyline class="elab" points="250,515 250,453" marker-end="url(#e)"/>
  <text class="s" x="262" y="502" style="fill:var(--accent)">at elaboration, the list folds into the cases</text>
  <text class="b" x="164" y="539" style="fill:var(--accent)">L2 · the schedule<tspan class="s" style="fill:var(--muted)"> — one step, as the list of operations that the config builds. The mathematics is a program and not a state machine,</tspan></text>
  <text class="s" x="164" y="555">thus no box below is a block: the list is an OCaml value at elaboration, and the arrow states what it becomes.</text>

  <rect class="ghost" x="166" y="602" width="118" height="70" rx="5"/>
  <text class="t" x="177" y="624">embed</text>
  <text class="s" x="177" y="642">four seat rows and</text>
  <text class="s" x="177" y="658">the bar phase → h</text>
  <line class="gwire" x1="284" y1="649" x2="306" y2="649" marker-end="url(#g)"/>

  <path class="brace" d="M306,589 v-8 h790 v8"/>
  <text class="s" x="701" y="575" text-anchor="middle" style="fill:var(--accent)">× 6 layers — and the cost of each one is a constant of the shape, because a state has no fill</text>

  <rect class="ghost" x="306" y="602" width="112" height="70" rx="5"/>
  <text class="t" x="317" y="624">rms_norm</text>
  <text class="s" x="317" y="642">of the stream,</text>
  <text class="s" x="317" y="658">to y</text>
  <line class="gwire" x1="418" y1="649" x2="438" y2="649" marker-end="url(#g)"/>

  <rect class="ghost" x="438" y="602" width="130" height="70" rx="5"/>
  <text class="t" x="449" y="624">matvec W_in</text>
  <text class="s" x="449" y="642">the gate z, the conv</text>
  <text class="s" x="449" y="658">input, and raw dt</text>
  <line class="gwire" x1="568" y1="649" x2="588" y2="649" marker-end="url(#g)"/>

  <rect class="ghost" x="588" y="602" width="150" height="70" rx="5"/>
  <text class="t" x="599" y="624">conv · SiLU</text>
  <text class="s" x="599" y="642">4 taps a channel, and</text>
  <text class="s" x="599" y="658">tap k is zero before k</text>
  <line class="gwire" x1="738" y1="649" x2="758" y2="649" marker-end="url(#g)"/>

  <rect class="ghost" x="758" y="602" width="120" height="70" rx="5"/>
  <text class="t" x="769" y="624">decay</text>
  <text class="s" x="769" y="642">softplus, then</text>
  <text class="s" x="769" y="658">one exp2, a head</text>
  <line class="gwire" x1="878" y1="649" x2="898" y2="649" marker-end="url(#g)"/>

  <rect class="ghost" x="898" y="602" width="198" height="70" rx="5"/>
  <text class="t" x="909" y="624">state · readout</text>
  <text class="s" x="909" y="642">S ← αS + x(dt·B), then</text>
  <text class="s" x="909" y="658">S·C + D x, two terms an element</text>

  <!-- the gate branch of a layer -->
  <polyline class="gwire" points="1096,637 1116,637 1116,700 306,700 306,724" marker-end="url(#g)"/>
  <rect class="ghost" x="306" y="724" width="170" height="56" rx="5"/>
  <text class="t" x="317" y="746">gate · gated norm</text>
  <text class="s" x="317" y="764">y_out × SiLU(z), kept WIDE</text>
  <line class="gwire" x1="476" y1="752" x2="500" y2="752" marker-end="url(#g)"/>
  <rect class="ghost" x="500" y="724" width="150" height="56" rx="5"/>
  <text class="t" x="511" y="746">matvec W_out</text>
  <text class="s" x="511" y="764">adds back onto h</text>
  <text class="s" x="666" y="746">the layer ends; the state it wrote is the whole of what it remembers</text>
  <text class="s" x="666" y="764">no window, no ages, no causal wall — the recurrence cannot see forward</text>

  <!-- after the layers, the chain -->
  <polyline class="gwire" points="650,780 660,780 660,806 236,806 236,842 306,842" marker-end="url(#g)"/>

  <path class="brace" d="M306,829 v-8 h510 v8"/>
  <text class="s" x="561" y="815" text-anchor="middle" style="fill:var(--accent)">× 4 seats, the soprano first, and the chain accumulates in h itself</text>

  <rect class="ghost" x="306" y="842" width="112" height="62" rx="5"/>
  <text class="t" x="317" y="864">rms_norm</text>
  <text class="s" x="317" y="882">of the stream</text>
  <line class="gwire" x1="418" y1="877" x2="440" y2="877" marker-end="url(#g)"/>

  <rect class="ghost" x="440" y="842" width="140" height="62" rx="5"/>
  <text class="t" x="451" y="864">matvec</text>
  <text class="s" x="451" y="882">the 48 rows of</text>
  <text class="s" x="451" y="898">this seat</text>
  <line class="gwire" x1="580" y1="877" x2="602" y2="877" marker-end="url(#g)"/>

  <rect class="ghost" x="602" y="842" width="180" height="62" rx="5"/>
  <text class="t" x="613" y="864">sampler</text>
  <text class="s" x="613" y="882">temper · exp2 · min-p</text>
  <text class="s" x="613" y="898">u24 draw, and no fallback</text>
  <line class="gwire" x1="782" y1="877" x2="806" y2="877" marker-end="url(#g)"/>

  <rect class="ghost" x="806" y="842" width="140" height="62" rx="5"/>
  <text class="t" x="817" y="864">the frame</text>
  <text class="s" x="817" y="882">four codes, and L4</text>
  <text class="s" x="817" y="898">holds it for step</text>

  <text class="s" x="968" y="864">the head of era four, unchanged</text>
  <text class="s" x="968" y="882">a drawn step: 292 684 cycles, 2.93 ms at 100 MHz,</text>
  <text class="s" x="968" y="898">and the same number at every step of the walk</text>
</svg>
