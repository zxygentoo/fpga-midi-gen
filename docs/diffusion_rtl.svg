<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1330" viewBox="0 122 1560 1330" role="img" aria-label="Block schematic of the diffusion source: the scheduler with its frame store and its gap, and the generator with its walk, sheet, column engine and draw">
  <style>
    /* One palette, and it is the light one; see docs/board_rtl.svg for the reason. */
    :root {
      --bg: #ffffff; --fg: #1b1f24; --muted: #5c6570; --line: #3d454f;
      --box: #f2f4f7; --accent: #b45309; --accent-fill: #fdf3e3;
      --hot: #b91c1c;
    }
    text { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: var(--fg); }
    .b  { font-size: 12.5px; font-weight: 600; }
    .t  { font-size: 12px; }
    .s  { font-size: 10.5px; fill: var(--muted); }
    .hs { font-size: 10.5px; fill: var(--hot); }
    .blk     { fill: var(--box); stroke: var(--line); stroke-width: 1.4; }
    .outline { fill: none; stroke: var(--line); stroke-width: 1.4; }
    .wire    { stroke: var(--line); stroke-width: 1.6; fill: none; }
    .thin    { stroke: var(--line); stroke-width: 1; fill: none; opacity: .8; }
    .elab    { stroke: var(--accent); stroke-width: 1.3; fill: none; stroke-dasharray: 6 4; }
    .state   { fill: var(--accent-fill); stroke: var(--accent); stroke-width: 1.5; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--line)"/>
    </marker>
    <marker id="e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" style="fill:var(--accent)"/>
    </marker>
  </defs>
  <rect x="0" y="122" width="1560" height="1330" fill="var(--bg)"/>

  <text class="b" x="152" y="172" style="fill:var(--accent)">Diffusion.Source <tspan class="s">— a source on Source_intf: the Scheduler over the Generator, at a gap of 32 steps.</tspan></text>
  <text class="s" x="1394" y="172" text-anchor="end" style="fill:var(--accent)">rung 3 · l48-h20-100k · T 128 · P 48 · H 20 · G 5 · N 512</text>

  <!-- the ports -->
  <text class="t" x="120" y="245" text-anchor="end">rewind</text>
  <text class="s" x="120" y="261" text-anchor="end">latches the seed</text>
  <line class="wire" x1="126" y1="240" x2="152" y2="240" marker-end="url(#a)"/>
  <text class="t" x="120" y="313" text-anchor="end">step</text>
  <text class="s" x="120" y="329" text-anchor="end">one frame</text>
  <line class="wire" x1="126" y1="308" x2="152" y2="308" marker-end="url(#a)"/>

  <line class="wire" x1="1394" y1="326" x2="1412" y2="326" marker-end="url(#a)"/>
  <text class="t" x="1416" y="322">frame · valid</text>
  <text class="s" x="1416" y="338">four codes, seat 0</text>
  <text class="s" x="1416" y="354">idle · rest and PLAY</text>

  <!-- the scheduler -->
  <rect class="outline" x="152" y="188" width="1242" height="212" rx="5"/>
  <text class="b" x="166" y="210">Scheduler · the succession <tspan class="s">— the playing copy, the seeds, the gap and the restart</tspan></text>

  <rect class="state" x="176" y="244" width="76" height="32" rx="4"/>
  <text class="t" x="214" y="264" text-anchor="middle">Rest</text>
  <line class="wire" x1="252" y1="260" x2="270" y2="260" marker-end="url(#a)"/>
  <rect class="state" x="272" y="244" width="76" height="32" rx="4"/>
  <text class="t" x="310" y="264" text-anchor="middle">OPEN</text>
  <line class="wire" x1="348" y1="260" x2="366" y2="260" marker-end="url(#a)"/>
  <rect class="state" x="368" y="244" width="76" height="32" rx="4"/>
  <text class="t" x="406" y="264" text-anchor="middle">DRAW</text>
  <line class="wire" x1="444" y1="260" x2="462" y2="260" marker-end="url(#a)"/>
  <rect class="state" x="464" y="244" width="76" height="32" rx="4"/>
  <text class="t" x="502" y="264" text-anchor="middle">COPY</text>
  <line class="wire" x1="540" y1="260" x2="558" y2="260" marker-end="url(#a)"/>
  <rect class="state" x="560" y="244" width="76" height="32" rx="4"/>
  <text class="t" x="598" y="264" text-anchor="middle">PLAY</text>
  <polyline class="wire" points="598,276 598,294 406,294 406,278" marker-end="url(#a)"/>
  <text class="s" x="414" y="310">the boundary, every T + gap steps</text>

  <text class="s" x="176" y="332">Rest: idle 1, and a step answers silence.</text>
  <text class="s" x="176" y="348">OPEN strobes start; DRAW steps the seed;</text>
  <text class="s" x="176" y="364">COPY fills the store, T frames, 3 µs.</text>
  <text class="s" x="176" y="380">idle falls through the three, and holds in PLAY.</text>

  <rect class="outline" x="660" y="244" width="352" height="140" rx="4"/>
  <text class="t" x="672" y="266">the frame store · the pong</text>
  <text class="s" x="672" y="286">T frames of 32 bits, one RAMB18</text>
  <text class="s" x="672" y="302">Gibbs rewrites in place, thus the sheet</text>
  <text class="s" x="672" y="318">that plays is its own copy, and it holds</text>
  <text class="s" x="672" y="334">FRAMES: no vocabulary stands here</text>
  <text class="hs" x="672" y="356">a register BEFORE the memory is not</text>
  <text class="hs" x="672" y="372">a read port: the store falls to LUTRAM</text>

  <rect class="outline" x="1028" y="244" width="352" height="140" rx="4"/>
  <text class="t" x="1040" y="266">the seed and the gap</text>
  <text class="s" x="1040" y="286">rewind latches the panel view, and DRAW</text>
  <text class="s" x="1040" y="302">steps it: sheet k is (S + k) mod 2^32</text>
  <text class="s" x="1040" y="324">the gap is 32 steps, and the FIRST of</text>
  <text class="s" x="1040" y="340">them is the drain, thus the floor is 1</text>
  <text class="s" x="1040" y="362">a rewind in PLAY waits the walk out</text>

  <!-- the generator's face -->
  <line class="wire" x1="460" y1="402" x2="460" y2="472" marker-end="url(#a)"/>
  <text class="s" x="466" y="418">start</text>
  <line class="wire" x1="550" y1="402" x2="550" y2="472" marker-end="url(#a)"/>
  <text class="s" x="556" y="418">step</text>
  <line class="wire" x1="640" y1="472" x2="640" y2="402" marker-end="url(#a)"/>
  <text class="s" x="646" y="418">frame · valid · idle</text>

  <!-- the generator -->
  <rect class="outline" x="152" y="430" width="1242" height="982" rx="5"/>
  <text class="b" x="166" y="452">Generator <tspan class="s">· one sheet for each start, and it speaks no socket</tspan></text>

  <!-- L4: the walk -->
  <rect class="blk" x="180" y="474" width="560" height="166" rx="5"/>
  <text class="b" x="194" y="496">L4 · the walk</text>
  <text class="s" x="194" y="514">start is read at rest, and the PRNG's load rides it</text>

  <rect class="state" x="196" y="540" width="120" height="32" rx="4"/>
  <text class="t" x="256" y="560" text-anchor="middle">Idle · TRANSFER</text>
  <line class="wire" x1="316" y1="556" x2="332" y2="556" marker-end="url(#a)"/>
  <rect class="state" x="334" y="540" width="76" height="32" rx="4"/>
  <text class="t" x="372" y="560" text-anchor="middle">OPEN</text>
  <line class="wire" x1="410" y1="556" x2="426" y2="556" marker-end="url(#a)"/>
  <rect class="state" x="428" y="540" width="76" height="32" rx="4"/>
  <text class="t" x="466" y="560" text-anchor="middle">MASK</text>
  <line class="wire" x1="504" y1="556" x2="520" y2="556" marker-end="url(#a)"/>
  <rect class="state" x="522" y="540" width="82" height="32" rx="4"/>
  <text class="t" x="563" y="560" text-anchor="middle">SERVE</text>
  <polyline class="elab" points="563,540 563,530 428,530 428,538" marker-end="url(#e)"/>
  <text class="s" x="620" y="560" style="fill:var(--accent)">× N passes</text>
  <polyline class="wire" points="563,572 563,590 256,590 256,574" marker-end="url(#a)"/>
  <text class="s" x="194" y="610">Idle transfers too: one frame a step, and the face is cyclic</text>
  <text class="s" x="194" y="626">the frame that WRITES stands two cycles behind the DRAW</text>

  <!-- the generator's prng -->
  <rect class="blk" x="756" y="474" width="300" height="166" rx="5"/>
  <text class="b" x="770" y="496">Prng.Rtl · the one generator</text>
  <text class="s" x="770" y="518">xorshift32, one step a cycle</text>
  <text class="s" x="770" y="534">it serves the opening, every mask</text>
  <text class="s" x="770" y="550">and every draw IN ONE ORDER</text>
  <text class="hs" x="770" y="574">u24 &lt;- (u24 &lt;&lt; 8) | byte, high first</text>
  <text class="hs" x="770" y="590">a byte lands a cycle behind its step</text>
  <text class="s" x="770" y="616">the opening: low + ((k · w) &gt;&gt; 24)</text>

  <!-- the alpha rom -->
  <rect class="blk" x="1072" y="474" width="314" height="166" rx="5"/>
  <text class="b" x="1086" y="496">the alpha ROM</text>
  <text class="s" x="1086" y="518">N entries of 24 bits: the annealed</text>
  <text class="s" x="1086" y="534">schedule, on the generator's grid</text>
  <text class="s" x="1086" y="562">hidden = k &lt; alpha[pass]</text>
  <text class="s" x="1086" y="590">read at the start of a pass, the</text>
  <text class="s" x="1086" y="606">address before the memory</text>

  <!-- the sheet -->
  <rect class="blk" x="180" y="666" width="250" height="320" rx="5"/>
  <text class="b" x="194" y="688">Sheet</text>
  <text class="s" x="194" y="706">T × 4 cells in registers: a class</text>
  <text class="s" x="194" y="722">and a mask bit for each, written</text>
  <text class="s" x="194" y="738">in place and never cleared</text>

  <rect class="outline" x="194" y="754" width="222" height="66" rx="4"/>
  <text class="t" x="206" y="776">the cell port</text>
  <text class="s" x="206" y="794">one address, three users,</text>
  <text class="s" x="206" y="810">and no contention BY STATE</text>

  <rect class="outline" x="194" y="830" width="222" height="66" rx="4"/>
  <text class="t" x="206" y="852">the score face</text>
  <text class="s" x="206" y="870">Vocab.Rtl → one frame,</text>
  <text class="s" x="206" y="886">and the face is cyclic</text>

  <rect class="outline" x="194" y="906" width="222" height="66" rx="4"/>
  <text class="t" x="206" y="928">the stem face</text>
  <text class="s" x="206" y="946">a plane column, P × int16,</text>
  <text class="s" x="206" y="962">whole and combinational</text>

  <!-- the cost -->
  <rect class="outline" x="180" y="1012" width="250" height="138" rx="5"/>
  <text class="b" x="194" y="1034">one pass, and the period</text>
  <text class="t" x="194" y="1058">4 302 000 cycles less the draw</text>
  <text class="s" x="194" y="1078">forward 4 300 464 · cell walk 1 536</text>
  <text class="s" x="194" y="1100">N 512 draws in 22.0 s, and the</text>
  <text class="s" x="194" y="1116">board reads 22.29 s to the note</text>
  <text class="s" x="194" y="1138">one period is T + gap: 32.0 s</text>

  <!-- the column engine -->
  <rect class="outline" x="460" y="666" width="926" height="562" rx="6"/>
  <text class="b" x="474" y="688">Forward · the column engine <tspan class="s">— one pass over the sheet as it stands</tspan></text>
  <text class="s" x="474" y="706">the dwell is the column, then the output group, the input channel, the tap — and every fetch hides under it</text>

  <!-- the memories -->
  <rect class="blk" x="474" y="722" width="266" height="66" rx="4"/>
  <text class="t" x="486" y="744">X, the store, and the Y ring</text>
  <text class="s" x="486" y="762">T · H columns of 768 bits, banked</text>
  <text class="s" x="486" y="778">the ring is 4 · H; B trails A by two</text>

  <rect class="blk" x="754" y="722" width="266" height="66" rx="4"/>
  <text class="t" x="766" y="744">the norm ROM</text>
  <text class="s" x="766" y="762">gain, shift and bias at one</text>
  <text class="s" x="766" y="778">address, never out of step</text>

  <rect class="blk" x="1034" y="722" width="266" height="66" rx="4"/>
  <text class="t" x="1046" y="744">the weight ROM · two banks</text>
  <text class="s" x="1046" y="762">the dwell order, thus the address</text>
  <text class="s" x="1046" y="778">only counts · 32 768 + 1 024</text>

  <!-- the bands -->
  <rect class="blk" x="474" y="812" width="266" height="66" rx="4"/>
  <text class="t" x="486" y="834">the window · three slots</text>
  <text class="s" x="486" y="852">rotated in place: t-1, t, t+1</text>
  <text class="s" x="486" y="868">beyond the roll, a zero column</text>

  <rect class="blk" x="754" y="812" width="266" height="66" rx="4"/>
  <text class="t" x="766" y="834">the norm bank</text>
  <text class="s" x="766" y="852">G entries a group, and one</text>
  <text class="s" x="766" y="868">band serves every group</text>

  <rect class="blk" x="1034" y="812" width="266" height="66" rx="4"/>
  <text class="t" x="1046" y="834">the residual band</text>
  <text class="s" x="1046" y="852">G columns of X for the join</text>
  <text class="s" x="1046" y="868">of a closing pair</text>

  <!-- the array -->
  <rect class="blk" x="474" y="894" width="826" height="148" rx="4"/>
  <text class="b" x="486" y="916">L2 · Column_array — P rows × G lanes = 240 DSP48, one for each lane</text>
  <text class="s" x="486" y="936">weight-stationary: one weight read feeds P lanes, and two broadcast trees carry it</text>
  <text class="s" x="486" y="952">the accumulation stands inside the DSP over the dwell, thus no adder tree anywhere</text>
  <line class="thin" x1="486" y1="968" x2="1288" y2="968"/>
  <text class="t" x="486" y="990">the drain chain · P stages</text>
  <text class="s" x="486" y="1008">the array's output port: without it that port is P by G by 32 bits</text>
  <text class="s" x="486" y="1024">one capture register drives every stage of it</text>

  <!-- the epilogue and the writes -->
  <rect class="blk" x="474" y="1058" width="406" height="88" rx="4"/>
  <text class="b" x="486" y="1080">L3 · Epilogue</text>
  <text class="s" x="486" y="1100">the gain in two stages, the shift,</text>
  <text class="s" x="486" y="1116">the bias, then the ReLU, the clamp</text>
  <text class="s" x="486" y="1132">and the residual add of a pair</text>

  <rect class="blk" x="894" y="1058" width="406" height="88" rx="4"/>
  <text class="b" x="906" y="1080">the output band → the column write</text>
  <text class="s" x="906" y="1100">G columns buffered, then one write a cycle</text>
  <text class="s" x="906" y="1116">a pass leaves the stores as it found them,</text>
  <text class="s" x="906" y="1132">except X — thus no clear</text>

  <!-- the logit file -->
  <rect class="blk" x="474" y="1162" width="826" height="52" rx="4"/>
  <text class="b" x="486" y="1184">the logit file · four columns of P × int16 — the head writes one step, not a tensor</text>
  <text class="s" x="486" y="1202">step_ready is a LEVEL: the walk counts its own acknowledgements, and that count IS the step</text>

  <!-- the spine -->
  <line class="wire" x1="607" y1="788" x2="607" y2="810" marker-end="url(#a)"/>
  <line class="wire" x1="887" y1="788" x2="887" y2="810" marker-end="url(#a)"/>
  <polyline class="wire" points="700,788 700,798 1167,798 1167,810" marker-end="url(#a)"/>
  <line class="wire" x1="607" y1="878" x2="607" y2="892" marker-end="url(#a)"/>
  <line class="wire" x1="607" y1="1042" x2="607" y2="1056" marker-end="url(#a)"/>
  <line class="wire" x1="880" y1="1102" x2="892" y2="1102" marker-end="url(#a)"/>
  <line class="wire" x1="607" y1="1146" x2="607" y2="1160" marker-end="url(#a)"/>

  <!-- the weight net, down the right channel -->
  <polyline class="wire" points="1300,755 1338,755 1338,962 1302,962" marker-end="url(#a)"/>

  <!-- the score face, up to the walk that answers with it -->
  <polyline class="wire" points="430,852 444,852 444,644" marker-end="url(#a)"/>

  <!-- the stem, into the window -->
  <polyline class="wire" points="430,928 452,928 452,862 474,862" marker-end="url(#a)"/>

  <!-- the draw -->
  <rect class="blk" x="180" y="1254" width="1206" height="120" rx="5"/>
  <text class="b" x="194" y="1276">Draw · one cell's logits and one uniform into one class</text>
  <text class="s" x="194" y="1294">era four's pipeline, and the pick always lands</text>

  <rect class="outline" x="200" y="1308" width="250" height="52" rx="4"/>
  <text class="t" x="212" y="1330">the peak</text>
  <text class="s" x="212" y="1348">P cycles, taken here</text>
  <line class="wire" x1="450" y1="1334" x2="470" y2="1334" marker-end="url(#a)"/>

  <rect class="outline" x="472" y="1308" width="280" height="52" rx="4"/>
  <text class="t" x="484" y="1330">the tempered weights</text>
  <text class="s" x="484" y="1348">exp2, one magnitude a cycle</text>
  <line class="wire" x1="752" y1="1334" x2="772" y2="1334" marker-end="url(#a)"/>

  <rect class="outline" x="774" y="1308" width="270" height="52" rx="4"/>
  <text class="t" x="786" y="1330">the threshold</text>
  <text class="s" x="786" y="1348">(u24 · total) &gt;&gt; 24, staged</text>
  <line class="wire" x1="1044" y1="1334" x2="1064" y2="1334" marker-end="url(#a)"/>

  <rect class="outline" x="1066" y="1308" width="300" height="52" rx="4"/>
  <text class="t" x="1078" y="1330">the pick</text>
  <text class="s" x="1078" y="1348">155 cycles at P 48, always</text>

  <line class="wire" x1="760" y1="1214" x2="760" y2="1252" marker-end="url(#a)"/>
  <text class="s" x="768" y="1240">the seat's logits, standing still</text>

  <!-- the drawn class, back to the sheet -->
  <polyline class="wire" points="200,1374 200,1398 168,1398 168,787 180,787" marker-end="url(#a)"/>
  <text class="s" x="216" y="1390">the drawn class → the cell port</text>
</svg>
