[project]
name = "mgen-jax"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # THE THREE JAX PACKAGES MOVE TOGETHER OR NOT AT ALL. jax, jaxlib and the CUDA
    # plugin must state one version: a plugin one release behind the runtime is
    # refused ("not compatible ... will not be used") and the trainer falls back to
    # the CPU SILENTLY, ten times slower and saying nothing. flax 0.12.9 wants jax
    # 0.11.1 or later, thus all three moved from 0.11.0 on 2026-08-28.
    "jax[cuda12]==0.11.1",
    "jaxlib==0.11.1",
    "jax-cuda12-plugin==0.11.1",
    "flax>=0.12.9",
    "optax>=0.2.8",
    "safetensors>=0.8.0",
    "click>=8.1",
    "mido>=1.3",
]

# THE PYTHON ROOT IS THE REPOSITORY ROOT, as the dune root is: `uv run` walks UP to find
# this file, thus `uv run pytest` and `uv run ruff check` answer from `lib/` and from
# `docs/` as they do from here, and nothing has to be run from one directory.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The install is the whole of what the build system is for: hatchling writes ONE LINE into
# the environment, the absolute path of `jax/`, and that is what carries `python -m
# diffusion.infer` from any directory. No wheel is ever shipped.
#
# IT IS ALSO WHAT KEEPS `import corpus` HONEST. `corpus/` at the root is the chorale data
# and it holds no `__init__.py`, thus a bare cwd resolves the name to that directory as an
# empty namespace package -- no `load_pieces`, and an AttributeError instead of an
# ImportError. A real module on the path wins over a namespace portion, and this puts one
# there for every process of the environment.
#
# THE PATH IS ABSOLUTE: move or rename the checkout and the line names a directory that is
# gone, which Python SKIPS in silence and the corpus trap returns. Build the environment
# again after a move, as a uv environment needs anyway.
[tool.hatch.build.targets.wheel]
sources = ["jax"]
only-include = ["jax"]
exclude = ["jax/tests", "jax/_data"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
# `jax` AND NEVER `.`: the root holds `corpus/`, the chorale data, which shadows
# `jax/corpus.py` as an empty namespace package wherever it stands first on the path.
# pytest inserts these at the FRONT, thus the module wins. `tests/` is not installed --
# the build excludes it -- thus `from tests import gate` reads the path stated here.
pythonpath = ["jax"]
# PYTEST READS THIS AT THE ROOTDIR AND NOWHERE ELSE, which is its documented rule: run it
# from another directory of the tree and it collects that directory instead, finds no
# test, and exits 5. Every other command of the environment answers from anywhere.
testpaths = ["jax/tests"]
# -n auto: the suite is 217 tests of numpy and small jitted models, thus it parallelises
# almost perfectly -- measured 2026-09-02, 103 s against 30 s on twenty cores. Every test
# is deterministic and none writes outside `tmp_path`, thus the split cannot change an
# answer. `-n0` runs them in one process where a traceback is easier to read. NOT
# `-p no:xdist`: dropping the plugin leaves the `-n` of this line unrecognised, and pytest
# exits on the argument instead of running.
addopts = "-n auto"
markers = [
    # the drift sweeps and the trainer smokes: seconds each and they gate the ARITHMETIC,
    # not a rule of the code. `-m "not slow"` is the inner loop; the whole suite is what
    # a commit passes.
    "slow: a gate that costs seconds because it measures rather than asserts",
]

[tool.ruff]
# the width of the OCaml side: ocamlformat, profile janestreet
line-length = 90
# WHERE THE FIRST PARTY LIVES. It is not the root: with the root alone, `import corpus`
# and `import ar_model` sort as third-party imports of some other project's package, and
# every module of the tree fails I001 for a grouping nothing can fix.
src = ["jax"]

[tool.ruff.lint]
# E501 is not in the default set, thus the width above bound the formatter alone and 343
# lines had passed it. `ruff format` is NOT adopted -- the OCaml side formats and the
# Python side lints -- so the width is held by this rule and by nothing else.
extend-select = ["E501"]
