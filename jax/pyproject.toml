[project]
name = "mgen-jax"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "jax[cuda12]>=0.11.0",
    "safetensors>=0.8.0",
    "click>=8.1",
    "mido>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# the width of the OCaml side: ocamlformat, profile janestreet
line-length = 90
