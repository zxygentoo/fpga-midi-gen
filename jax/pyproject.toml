[project]
name = "mgen-jax"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    # THE THREE JAX PACKAGES MOVE TOGETHER OR NOT AT ALL. jax, jaxlib and the CUDA
    # plugin must state one version: a plugin one release behind the runtime is
    # refused ("not compatible ... will not be used") and the trainer falls back to
    # the CPU SILENTLY, ten times slower and saying nothing. flax 0.12.9 wants jax
    # 0.11.1 or later, thus all three moved from 0.11.0 on 2026-08-28.
    "jax[cuda12]==0.11.1",
    "jaxlib==0.11.1",
    "jax-cuda12-plugin==0.11.1",
    "flax>=0.12.9",
    "optax>=0.2.8",
    "safetensors>=0.8.0",
    "click>=8.1",
    "mido>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
# the width of the OCaml side: ocamlformat, profile janestreet
line-length = 90

[tool.ruff.lint]
# E501 is not in the default set, thus the width above bound the formatter alone and 343
# lines had passed it. `ruff format` is NOT adopted -- the OCaml side formats and the
# Python side lints -- so the width is held by this rule and by nothing else.
extend-select = ["E501"]
